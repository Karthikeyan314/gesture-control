[project]
name = "gesture-control"
version = "0.1.0"
description = "Control a Windows PC with hand gestures from a webcam: MediaPipe hand landmarks, rule-based gesture recognition, debounced OS actions, tray app with live overlay."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The core (gesture logic, smoothing, config, action dispatch) is pure Python so it runs
# and tests anywhere. Camera, model and OS-control libraries live in the `app` extra.
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
app = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "pillow>=10",
    "pyautogui>=0.9.54",
    "pystray>=0.19",
]

[project.scripts]
gesture-control = "gesture_control.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_control"]
